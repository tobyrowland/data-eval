name: release
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PREVIEW_TAG: v0.1.0-preview
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf file

      - name: Test
        run: cargo test --locked --release --workspace

      - name: Check desktop dependency tree has no networking crates
        shell: bash
        run: ./scripts/check-desktop-deps.sh

      # ---------------- desktop app installers
      # Both apps bundle into the same target folders, and a later build can
      # clear an earlier one's output, so each app's installers are moved to
      # stage/<app>/ straight after it is built.
      - name: Desktop apps
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) args="--bundles nsis,msi" ;;
            macOS)   args="--bundles dmg --target universal-apple-darwin" ;;
            Linux)   args="--bundles deb,appimage" ;;
          esac
          for app in scout-app scout-fetch; do
            (cd "crates/$app" && npx -y "$TAURI_CLI" build $args)
            mkdir -p "stage/$app"
            for d in target/release/bundle target/universal-apple-darwin/release/bundle; do
              if [ -d "$d" ]; then cp -R "$d"/. "stage/$app/"; rm -rf "$d"; fi
            done
            find "stage/$app" -maxdepth 2 -type f
          done

      # ---------------- command-line tool
      - name: CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --release --bin working-minds
          mkdir -p dist/Working-Minds-CLI
          cp target/release/working-minds.exe packaging/QUICKSTART.txt dist/Working-Minds-CLI/
          (cd dist && 7z a -tzip ../Working-Minds-CLI-${{ matrix.name }}.zip Working-Minds-CLI)
      - name: CLI (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --bin working-minds --target aarch64-apple-darwin
          cargo build --locked --release --bin working-minds --target x86_64-apple-darwin
          mkdir -p dist/Working-Minds-CLI
          lipo -create -output dist/Working-Minds-CLI/working-minds \
            target/aarch64-apple-darwin/release/working-minds target/x86_64-apple-darwin/release/working-minds
          codesign --force --sign - dist/Working-Minds-CLI/working-minds
          cp packaging/QUICKSTART.txt dist/Working-Minds-CLI/
          (cd dist && ditto -c -k --keepParent Working-Minds-CLI ../Working-Minds-CLI-${{ matrix.name }}.zip)
      - name: CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --bin working-minds
          mkdir -p dist/Working-Minds-CLI
          cp target/release/working-minds packaging/QUICKSTART.txt dist/Working-Minds-CLI/
          tar -C dist -czf Working-Minds-CLI-${{ matrix.name }}.tar.gz Working-Minds-CLI

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          for app in scout-app scout-fetch; do
            [ "$app" = scout-fetch ] && n="Working-Minds-Attachment-Downloader" || n="Working-Minds"
            for f in stage/$app/nsis/*.exe; do cp "$f" "out/$n-Setup-windows-x64.exe"; done
            for f in stage/$app/msi/*.msi; do cp "$f" "out/$n-windows-x64.msi"; done
            for f in stage/$app/dmg/*.dmg; do cp "$f" "out/$n-macos-universal.dmg"; done
            for f in stage/$app/appimage/*.AppImage; do cp "$f" "out/$n-linux-x64.AppImage"; done
            for f in stage/$app/deb/*.deb; do cp "$f" "out/$n-linux-x64.deb"; done
          done
          cp Working-Minds-CLI-* out/
          ls -la out
          # Both apps must have produced installers for this platform.
          test -n "$(ls out | grep -v -e CLI -e Attachment)"
          test -n "$(ls out | grep Attachment)"

      - uses: actions/upload-artifact@v4
        with:
          name: Working-Minds-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum Working-Minds-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Remove superseded preview files
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view "$PREVIEW_TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset "$PREVIEW_TAG" "$a" -R "$GITHUB_REPOSITORY" -y
          done
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.PREVIEW_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Working Minds {0}', github.ref_name) || 'Working Minds 0.1.0 preview' }}
          prerelease: true
          make_latest: false
          body: |
            Preview build of Working Minds, built from ${{ github.sha }}.

            **Desktop app (recommended)**: drag in your exports and get a visual map of your data.
            - Windows 10/11: `Working-Minds-Setup-windows-x64.exe` (or the `.msi`)
            - macOS 14+ (Apple Silicon and Intel): `Working-Minds-macos-universal.dmg`
            - Linux: `Working-Minds-linux-x64.AppImage` or `.deb`

            **Attachment Downloader (optional companion)**: fetches the files your Slack export links to, directly from Slack. It is the only Working Minds tool that connects to the internet, and it connects only to Slack.
            - Windows: `Working-Minds-Attachment-Downloader-Setup-windows-x64.exe`
            - macOS: `Working-Minds-Attachment-Downloader-macos-universal.dmg`
            - Linux: `Working-Minds-Attachment-Downloader-linux-x64.AppImage` or `.deb`

            **Command-line tool (advanced)**: `Working-Minds-CLI-*` archives.

            This preview is not code-signed yet, so you will see a first-run warning.
            - Windows: choose "More info", then "Run anyway".
            - macOS: open the app once with right-click › Open, or allow it in System Settings › Privacy & Security.

            Everything runs on your computer. Nothing is uploaded.
          files: out/*
