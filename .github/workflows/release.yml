name: release
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build still in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_TAG: v0.1.0-preview
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows x64 only for now. The macOS and Linux steps below are kept;
        # add these back to build them again:
        #   - os: macos-latest
        #     name: macos-universal
        #   - os: ubuntu-22.04
        #     name: linux-x64
        include:
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf file

      # Tests run in the ci workflow; this one only builds installers.
      - name: Check desktop dependency tree has no networking crates
        shell: bash
        run: ./scripts/check-desktop-deps.sh

      # ---------------- desktop app installers
      # Both apps bundle into the same target folders, and a later build can
      # clear an earlier one's output, so each app's installers are moved to
      # stage/<app>/ straight after it is built.
      - name: Desktop apps
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) args="--bundles nsis" ;;
            macOS)   args="--bundles dmg --target universal-apple-darwin" ;;
            Linux)   args="--bundles deb,appimage" ;;
          esac
          for app in scout-app scout-fetch; do
            (cd "crates/$app" && npx -y "$TAURI_CLI" build $args)
            mkdir -p "stage/$app"
            for d in target/release/bundle target/universal-apple-darwin/release/bundle; do
              if [ -d "$d" ]; then cp -R "$d"/. "stage/$app/"; rm -rf "$d"; fi
            done
            find "stage/$app" -maxdepth 2 -type f
          done

      # The command-line tool (Working-Minds-CLI-*) is paused with the other
      # platforms; see git history to restore its build steps.

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          for app in scout-app scout-fetch; do
            [ "$app" = scout-fetch ] && n="Working-Minds-Attachment-Downloader" || n="Working-Minds"
            for f in stage/$app/nsis/*.exe; do cp "$f" "out/$n-Setup-windows-x64.exe"; done
            for f in stage/$app/dmg/*.dmg; do cp "$f" "out/$n-macos-universal.dmg"; done
            for f in stage/$app/appimage/*.AppImage; do cp "$f" "out/$n-linux-x64.AppImage"; done
            for f in stage/$app/deb/*.deb; do cp "$f" "out/$n-linux-x64.deb"; done
          done
          ls -la out
          # Both apps must have produced installers for this platform.
          test -n "$(ls out | grep -v Attachment)"
          test -n "$(ls out | grep Attachment)"

      - uses: actions/upload-artifact@v4
        with:
          name: Working-Minds-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum Working-Minds-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Remove superseded preview files
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view "$PREVIEW_TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset "$PREVIEW_TAG" "$a" -R "$GITHUB_REPOSITORY" -y
          done
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.PREVIEW_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Working Minds {0}', github.ref_name) || 'Working Minds 0.1.0 preview' }}
          prerelease: true
          make_latest: false
          body: |
            Preview build of Working Minds, built from ${{ github.sha }}.

            This preview is for Windows 10/11 (64-bit) only. macOS and Linux builds will return later.

            **Desktop app (recommended)**: drag in your exports and get a visual map of your data.
            - `Working-Minds-Setup-windows-x64.exe`

            **Attachment Downloader (optional companion)**: fetches the files your Slack export links to, directly from Slack. It is the only Working Minds tool that connects to the internet, and it connects only to Slack.
            - `Working-Minds-Attachment-Downloader-Setup-windows-x64.exe`

            This preview is not code-signed yet, so Windows shows a first-run warning: choose "More info", then "Run anyway".
            If the installer says Working Minds is running, click OK to close it and continue.

            Everything runs on your computer. Nothing is uploaded.
          files: out/*
