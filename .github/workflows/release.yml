name: release
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PREVIEW_TAG: v0.1.0-preview

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Test
        run: cargo test --locked --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --release --bin datapack-scout
          mkdir -p dist/DataPack-Scout
          cp target/release/datapack-scout.exe packaging/QUICKSTART.txt dist/DataPack-Scout/
          cd dist && 7z a -tzip ../DataPack-Scout-${{ matrix.name }}.zip DataPack-Scout

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --bin datapack-scout --target aarch64-apple-darwin
          cargo build --locked --release --bin datapack-scout --target x86_64-apple-darwin
          mkdir -p dist/DataPack-Scout
          lipo -create -output dist/DataPack-Scout/datapack-scout \
            target/aarch64-apple-darwin/release/datapack-scout \
            target/x86_64-apple-darwin/release/datapack-scout
          chmod +x dist/DataPack-Scout/datapack-scout
          cp packaging/QUICKSTART.txt dist/DataPack-Scout/
          # Ad-hoc signature so Apple Silicon will run it; not a Developer ID signature.
          codesign --force --sign - dist/DataPack-Scout/datapack-scout
          cd dist && ditto -c -k --keepParent DataPack-Scout ../DataPack-Scout-${{ matrix.name }}.zip

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --bin datapack-scout
          mkdir -p dist/DataPack-Scout
          cp target/release/datapack-scout packaging/QUICKSTART.txt dist/DataPack-Scout/
          tar -C dist -czf DataPack-Scout-${{ matrix.name }}.tar.gz DataPack-Scout

      - uses: actions/upload-artifact@v4
        with:
          name: DataPack-Scout-${{ matrix.name }}
          path: DataPack-Scout-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum DataPack-Scout-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.PREVIEW_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('DataPack Scout {0}', github.ref_name) || 'DataPack Scout 0.1.0 preview' }}
          prerelease: true
          make_latest: false
          body: |
            Preview build of DataPack Scout, built from ${{ github.sha }}.

            Download the file for your computer, unzip it and double-click `datapack-scout`. QUICKSTART.txt inside explains the first-run security prompts: this preview is not code-signed yet.

            - Windows 10/11 (64-bit): DataPack-Scout-windows-x64.zip
            - macOS 14+ (Apple Silicon and Intel): DataPack-Scout-macos-universal.zip
            - Linux (x86-64): DataPack-Scout-linux-x64.tar.gz

            Everything runs on your computer. The app has no network capability.
          files: out/*
