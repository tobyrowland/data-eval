name: ci
# Windows x64 only for now; other platforms come back once Windows is done.
# Runs once per change: on pull requests, and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Desktop dependency tree has no networking crates
        shell: bash
        run: ./scripts/check-desktop-deps.sh
